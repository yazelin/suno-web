[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "suno-web"
version = "0.1.0"
description = "Suno 網頁版自動化 — job 式音樂生成 API 與 CLI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "playwright>=1.49",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
suno-web = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
artifacts = ["src/commands/*.md", "src/commands/*.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not browser'"
markers = ["browser: 需要真的啟動 Chromium（預設跳過）"]
